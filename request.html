        function setLanguage(lang) {
            if (!i18n[lang]) return;
            currentLang = lang;
            const data = i18n[lang];

            // 1. Set HTML Direction & Lang attributes
            document.documentElement.setAttribute('dir', data.dir);
            document.documentElement.setAttribute('lang', data.lang);

            // 2. Adjust Icon placements for RTL/LTR
            const iconPositions = document.querySelectorAll('.icon-pos');
            const iconChevrons = document.querySelectorAll('.icon-chevron');
            const fieldPaddings = document.querySelectorAll('.field-padding');

            if (data.dir === 'rtl') {
                iconPositions.forEach(el => { el.style.right = '0.9rem'; el.style.left = 'auto'; });
                iconChevrons.forEach(el => { el.style.left = '0.9rem'; el.style.right = 'auto'; });
                fieldPaddings.forEach(el => { el.style.paddingRight = '2.6rem'; el.style.paddingLeft = '1rem'; });
            } else {
                iconPositions.forEach(el => { el.style.left = '0.9rem'; el.style.right = 'auto'; });
                iconChevrons.forEach(el => { el.style.right = '0.9rem'; el.style.left = 'auto'; });
                fieldPaddings.forEach(el => { el.style.paddingLeft = '2.6rem'; el.style.paddingRight = '1rem'; });
            }

            // 3. Update Text Content Across Page
            document.getElementById('txt-status-online').textContent = data.statusOnline;
            document.getElementById('txt-title').textContent = data.title;
            document.getElementById('txt-subtitle').textContent = data.subtitle;

            document.getElementById('lbl-fullname').childNodes[0].nodeValue = data.lblName + ' ';
            document.getElementById('fullName').placeholder = data.placeholderName;

            document.getElementById('lbl-phone').childNodes[0].nodeValue = data.lblPhone + ' ';
            document.getElementById('lbl-wilaya').childNodes[0].nodeValue = data.lblWilaya + ' ';
            document.getElementById('wilaya').placeholder = data.placeholderWilaya;

            document.getElementById('lbl-email').textContent = data.lblEmail;
            document.getElementById('lbl-optional').textContent = data.lblOptional;

            document.getElementById('lbl-service-type').childNodes[0].nodeValue = data.lblServiceType + ' ';
            
            // Re-populate Service Dropdown
            const select = document.getElementById('serviceType');
            const currentSelected = select.value;
            select.innerHTML = `<option value="" disabled ${!currentSelected ? 'selected' : ''}>${data.selectPrompt}</option>`;
            
            data.services.forEach((serviceText, index) => {
                const opt = document.createElement('option');
                opt.value = serviceText;
                opt.textContent = serviceText;
                if (currentSelected && currentSelected.includes(index + 1)) {
                    opt.selected = true;
                }
                select.appendChild(opt);
            });

            document.getElementById('lbl-urgency').textContent = data.lblUrgency;
            document.getElementById('opt-urgency-high').textContent = data.urgencyHigh;
            document.getElementById('opt-urgency-medium').textContent = data.urgencyMedium;
            document.getElementById('opt-urgency-low').textContent = data.urgencyLow;

            document.getElementById('lbl-details').childNodes[0].nodeValue = data.lblDetails + ' ';
            document.getElementById('details').placeholder = data.placeholderDetails;

            document.getElementById('btnText').textContent = data.btnSubmit;
            document.getElementById('btn-modal-close').textContent = data.btnModalClose;
            document.getElementById('txt-slogan').textContent = data.slogan;

            // 4. Update Language Switcher Active States
            ['ar', 'fr', 'en'].forEach(l => {
                const btn = document.getElementById(`lang-${l}`);
                if (l === lang) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
        }

        async function submitForm(e) {
            e.preventDefault();

            const data = i18n[currentLang];

            // Check if Google Script URL is missing
            if (!SCRIPT_URL || SCRIPT_URL === "ضع_رابط_GOOGLE_SCRIPT_هنا") {
                showModal('error', data.scriptNoticeTitle, data.scriptNoticeMsg);
                return;
            }

            const submitBtn = document.getElementById('submitBtn');
            const btnText = document.getElementById('btnText');
            const btnIcon = document.getElementById('btnIcon');
            const btnSpinner = document.getElementById('btnSpinner');

            // Set UI Loading State
            submitBtn.disabled = true;
            btnText.textContent = data.btnSubmitting;
            btnIcon.classList.add('hidden');
            btnSpinner.classList.remove('hidden');

            const payload = {
                fullName: document.getElementById('fullName').value,
                phone: document.getElementById('phone').value,
                wilaya: document.getElementById('wilaya').value,
                email: document.getElementById('email').value || "N/A",
                serviceType: document.getElementById('serviceType').value,
                urgency: document.querySelector('input[name="urgency"]:checked').value,
                details: document.getElementById('details').value,
                lang: currentLang,
                timestamp: new Date().toISOString()
            };

            try {
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                showModal('success', data.successTitle, data.successMsg);
                document.getElementById('serviceForm').reset();

            } catch (err) {
                console.error(err);
                showModal('error', data.errorTitle, data.errorMsg);
            } finally {
                submitBtn.disabled = false;
                btnText.textContent = data.btnSubmit;
                btnIcon.classList.remove('hidden');
                btnSpinner.classList.add('hidden');
            }
        }

        // Modal Handler
        function showModal(type, title, msg) {
            const modal = document.getElementById('statusModal');
            const modalIcon = document.getElementById('modalIcon');
            const modalTitle = document.getElementById('modalTitle');
            const modalMsg = document.getElementById('modalMsg');

            if (type === 'success') {
                modalIcon.className = "w-16 h-16 rounded-2xl flex items-center justify-center text-3xl mb-4 bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 shadow-lg shadow-emerald-500/10";
                modalIcon.innerHTML = '<i class="fa-solid fa-circle-check"></i>';
            } else {
                modalIcon.className = "w-16 h-16 rounded-2xl flex items-center justify-center text-3xl mb-4 bg-rose-500/20 text-rose-400 border border-rose-500/30 shadow-lg shadow-rose-500/10";
                modalIcon.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i>';
            }

            modalTitle.textContent = title;
            modalMsg.textContent = msg;

            modal.classList.remove('pointer-events-none', 'opacity-0');
            modal.classList.add('opacity-100');
        }

        function closeStatusModal() {
            const modal = document.getElementById('statusModal');
            modal.classList.remove('opacity-100');
            modal.classList.add('pointer-events-none', 'opacity-0');
        }

        // Animated Particle Swarm Background
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let width, height, particles = [];

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.vx = (Math.random() - 0.5) * 0.35;
                this.vy = (Math.random() - 0.5) * 0.35;
                this.radius = Math.random() * 1.5 + 0.8;
                this.color = Math.random() > 0.5 ? '#00f2fe' : '#00e676';
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                if (this.x < 0 || this.x > width) this.vx *= -1;
                if (this.y < 0 || this.y > height) this.vy *= -1;
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.globalAlpha = 0.35;
                ctx.fill();
            }
        }

        for (let i = 0; i < 40; i++) particles.push(new Particle());

        function animate() {
            ctx.clearRect(0, 0, width, height);
            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();
                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < 110) {
                        ctx.beginPath();
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.strokeStyle = '#00f2fe';
                        ctx.globalAlpha = (1 - dist / 110) * 0.12;
                        ctx.stroke();
                    }
                }
            }
            requestAnimationFrame(animate);
        }

        // Initialize default language and particle loop on DOM load
        window.onload = function() {
            setLanguage('ar');
            animate();
        };
    </script>
</body>
</html>
