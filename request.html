<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>طلب خدمة - Request Form</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Poppins:wght@400;600;700&display=swap');
        body {
            font-family: 'Cairo', 'Poppins', sans-serif;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between p-4 sm:p-6">

    <!-- Header / Language Switcher -->
    <header class="max-w-xl mx-auto w-full flex justify-between items-center mb-6">
        <div class="flex items-center space-x-3 space-x-reverse">
            <img src="main/images/P logo.png" alt="Logo" class="h-12 w-auto object-contain" onerror="this.onerror=null; this.src='https://via.placeholder.com/50?text=P';">
        </div>
        
        <!-- Language Switcher -->
        <div class="bg-slate-800 p-1 rounded-lg border border-slate-700 flex text-xs font-semibold">
            <button onclick="setLanguage('ar')" id="btn-ar" class="px-3 py-1.5 rounded-md transition-all duration-200 bg-emerald-500 text-white">العربية</button>
            <button onclick="setLanguage('fr')" id="btn-fr" class="px-3 py-1.5 rounded-md transition-all duration-200 text-slate-400 hover:text-white">Français</button>
            <button onclick="setLanguage('en')" id="btn-en" class="px-3 py-1.5 rounded-md transition-all duration-200 text-slate-400 hover:text-white">English</button>
        </div>
    </header>

    <!-- Main Card -->
    <main class="max-w-xl mx-auto w-full bg-slate-800 border border-slate-700 rounded-2xl p-6 sm:p-8 shadow-2xl relative overflow-hidden">
        
        <div class="text-center mb-6">
            <h1 id="title" class="text-2xl font-bold text-emerald-400">طلب خدمة جديدة</h1>
            <p id="subtitle" class="text-slate-400 text-sm mt-1">يرجى ملء الاستمارة لتقديم طلبك</p>
        </div>

        <form id="requestForm" onsubmit="handleSubmit(event)" class="space-y-5">
            
            <!-- Full Name -->
            <div>
                <label id="label-name" class="block text-sm font-medium mb-1 text-slate-300">الاسم الكامل *</label>
                <input type="text" id="name" name="name" required class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:border-transparent outline-none transition text-slate-100 placeholder-slate-500" placeholder="أدخل اسمك الكامل">
            </div>

            <!-- Phone Number -->
            <div>
                <label id="label-phone" class="block text-sm font-medium mb-1 text-slate-300">رقم الهاتف *</label>
                <input type="tel" id="phone" name="phone" required class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:border-transparent outline-none transition text-slate-100 placeholder-slate-500" placeholder="06XXXXXXXX">
            </div>

            <!-- Service Selection (9 Services) -->
            <div>
                <label id="label-service" class="block text-sm font-medium mb-1 text-slate-300">اختر الخدمة المطلوبة *</label>
                <select id="service" name="service" required class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:border-transparent outline-none transition text-slate-100">
                    <option value="" disabled selected id="opt-default">-- اختر خدمة --</option>
                    <option value="Service 1" id="opt-s1">1. تطوير المواقع الإلكترونية</option>
                    <option value="Service 2" id="opt-s2">2. تصميم الجرافيك والهويات البصرية</option>
                    <option value="Service 3" id="opt-s3">3. التسويق والإعلانات الممولة</option>
                    <option value="Service 4" id="opt-s4">4. إدارة صفحات التواصل الاجتماعي</option>
                    <option value="Service 5" id="opt-s5">5. المونتاج وصناعة الفيديو</option>
                    <option value="Service 6" id="opt-s6">6. الاستشارات التقنية</option>
                    <option value="Service 7" id="opt-s7">7. كتابة المحتوى والترجمة</option>
                    <option value="Service 8" id="opt-s8">8. تحسين محركات البحث (SEO)</option>
                    <option value="Service 9" id="opt-s9">9. الدعم الفني والصيانة</option>
                </select>
            </div>

            <!-- Additional Details -->
            <div>
                <label id="label-notes" class="block text-sm font-medium mb-1 text-slate-300">تفاصيل إضافية (اختياري)</label>
                <textarea id="notes" name="notes" rows="3" class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:border-transparent outline-none transition text-slate-100 placeholder-slate-500" placeholder="اكتب أي ملاحظات أو تفاصيل إضافية..."></textarea>
            </div>

            <!-- Submit Button -->
            <button type="submit" id="btn-submit" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-3.5 px-6 rounded-xl shadow-lg shadow-emerald-500/20 transition-all duration-200 flex items-center justify-center space-x-2 space-x-reverse">
                <span id="txt-submit">إرسال الطلب</span>
                <i class="fas fa-paper-plane text-sm"></i>
            </button>
        </form>

        <!-- Status Messages -->
        <div id="statusModal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
            <div class="bg-slate-800 border border-slate-700 rounded-2xl p-6 max-w-sm w-full text-center space-y-4 shadow-2xl">
                
                <!-- Success State -->
                <div id="stateSuccess" class="hidden space-y-3">
                    <div class="w-16 h-16 bg-emerald-500/10 text-emerald-400 rounded-full flex items-center justify-center mx-auto text-3xl border border-emerald-500/20">
                        <i class="fas fa-check-circle"></i>
                    </div>
                    <h3 id="msg-success-title" class="text-xl font-bold text-white">الطلب فات بنجاح!</h3>
                    <p id="msg-success-desc" class="text-slate-300 text-sm">تم استلام طلبك بنجاح وستتم معالجته في أقرب وقت.</p>
                    <button onclick="closeModal()" class="w-full bg-slate-700 hover:bg-slate-600 text-white font-medium py-2 rounded-xl transition">إغلاق</button>
                </div>

                <!-- Error State -->
                <div id="stateError" class="hidden space-y-3">
                    <div class="w-16 h-16 bg-rose-500/10 text-rose-400 rounded-full flex items-center justify-center mx-auto text-3xl border border-rose-500/20">
                        <i class="fas fa-exclamation-triangle"></i>
                    </div>
                    <h3 id="msg-error-title" class="text-xl font-bold text-white">الطلب ما فاتش!</h3>
                    <p id="msg-error-desc" class="text-slate-300 text-sm">حدث خطأ أثناء إرسال البيانات. يمكنك التواصل معنا مباشرة عبر واتساب.</p>
                    <div class="flex flex-col gap-2 pt-2">
                        <a id="btn-whatsapp" href="https://wa.me/213000000000" target="_blank" class="w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-2.5 rounded-xl transition flex items-center justify-center space-x-2 space-x-reverse">
                            <i class="fab fa-whatsapp text-lg"></i>
                            <span id="txt-whatsapp">التواصل عبر واتساب</span>
                        </a>
                        <button onclick="closeModal()" class="w-full bg-slate-700 hover:bg-slate-600 text-slate-300 text-sm py-2 rounded-xl transition">إغلاق</button>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="text-center text-slate-500 text-xs mt-6">
        &copy; <span id="year"></span> All Rights Reserved.
    </footer>

    <!-- Script Section -->
    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby12feoPBrFpsk-LqLoT_lozc8gM_TehtVLgfFsW8QudBb5flfnIZ69KNiTryM-VJhrLg/exec";
        const WHATSAPP_NUMBER = "213000000000"; // يمكنك تغيير الرقم هنا

        document.getElementById('year').innerText = new Date().getFullYear();

        const translations = {
            ar: {
                dir: 'rtl',
                title: 'طلب خدمة جديدة',
                subtitle: 'يرجى ملء الاستمارة لتقديم طلبك',
                nameLabel: 'الاسم الكامل *',
                namePlaceholder: 'أدخل اسمك الكامل',
                phoneLabel: 'رقم الهاتف *',
                phonePlaceholder: '06XXXXXXXX',
                serviceLabel: 'اختر الخدمة المطلوبة *',
                serviceDefault: '-- اختر خدمة --',
                notesLabel: 'تفاصيل إضافية (اختياري)',
                notesPlaceholder: 'اكتب أي ملاحظات أو تفاصيل إضافية...',
                submitBtn: 'إرسال الطلب',
                successTitle: 'الطلب فات بنجاح! (Message Fat)',
                successDesc: 'شكراً لك! تم تسليم طلبك بنجاح وستصلك استجابتنا قريباً.',
                errorTitle: 'الطلب ما فاتش! (Message Mafatch)',
                errorDesc: 'تعذر إرسال الطلب حالياً. يمكنكم تحويل الطلب أو التواصل معنا مباشرة عبر واتساب.',
                whatsappBtn: 'التواصل عبر واتساب',
                services: [
                    '1. تطوير المواقع الإلكترونية',
                    '2. تصميم الجرافيك والهويات البصرية',
                    '3. التسويق والإعلانات الممولة',
                    '4. إدارة صفحات التواصل الاجتماعي',
                    '5. المونتاج وصناعة الفيديو',
                    '6. الاستشارات التقنية',
                    '7. كتابة المحتوى والترجمة',
                    '8. تحسين محركات البحث (SEO)',
                    '9. الدعم الفني والصيانة'
                ]
            },
            fr: {
                dir: 'ltr',
                title: 'Demander un Service',
                subtitle: 'Veuillez remplir le formulaire ci-dessous',
                nameLabel: 'Nom Complet *',
                namePlaceholder: 'Votre nom complet',
                phoneLabel: 'Numéro de Téléphone *',
                phonePlaceholder: '06XXXXXXXX',
                serviceLabel: 'Sélectionner le Service *',
                serviceDefault: '-- Choisir un service --',
                notesLabel: 'Détails Supplémentaires (Optionnel)',
                notesPlaceholder: 'Écrivez vos remarques ici...',
                submitBtn: 'Envoyer la Demande',
                successTitle: 'Demande envoyée avec succès !',
                successDesc: 'Merci ! Votre demande a été reçue et sera traitée rapidement.',
                errorTitle: 'Échec de l\'envoi !',
                errorDesc: 'Impossible d\'envoyer votre demande. Vous pouvez nous contacter sur WhatsApp.',
                whatsappBtn: 'Contacter sur WhatsApp',
                services: [
                    '1. Développement Web',
                    '2. Design Graphique & Identité',
                    '3. Marketing & Publicité',
                    '4. Gestion des Réseaux Sociaux',
                    '5. Montage Vidéo',
                    '6. Conseil Technique',
                    '7. Rédaction & Traduction',
                    '8. Référencement (SEO)',
                    '9. Support Technique & Maintenance'
                ]
            },
            en: {
                dir: 'ltr',
                title: 'Request a Service',
                subtitle: 'Please fill out the form below',
                nameLabel: 'Full Name *',
                namePlaceholder: 'Enter your full name',
                phoneLabel: 'Phone Number *',
                phonePlaceholder: '06XXXXXXXX',
                serviceLabel: 'Select Service *',
                serviceDefault: '-- Select a service --',
                notesLabel: 'Additional Details (Optional)',
                notesPlaceholder: 'Write any notes or requirements...',
                submitBtn: 'Submit Request',
                successTitle: 'Request Sent Successfully!',
                successDesc: 'Thank you! Your request has been received and will be processed soon.',
                errorTitle: 'Submission Failed!',
                errorDesc: 'Could not send request right now. Feel free to reach out via WhatsApp.',
                whatsappBtn: 'Contact via WhatsApp',
                services: [
                    '1. Web Development',
                    '2. Graphic Design & Branding',
                    '3. Marketing & Ads',
                    '4. Social Media Management',
                    '5. Video Editing',
                    '6. Technical Consulting',
                    '7. Content Writing & Translation',
                    '8. Search Engine Optimization (SEO)',
                    '9. Technical Support & Maintenance'
                ]
            }
        };

        let currentLang = 'ar';

        function setLanguage(lang) {
            currentLang = lang;
            const t = translations[lang];

            document.documentElement.dir = t.dir;
            document.documentElement.lang = lang;

            // Toggle active lang buttons
            ['ar', 'fr', 'en'].forEach(l => {
                const btn = document.getElementById(`btn-${l}`);
                if (l === lang) {
                    btn.className = "px-3 py-1.5 rounded-md transition-all duration-200 bg-emerald-500 text-white font-bold";
                } else {
                    btn.className = "px-3 py-1.5 rounded-md transition-all duration-200 text-slate-400 hover:text-white";
                }
            });

            // Update Labels & Text
            document.getElementById('title').innerText = t.title;
            document.getElementById('subtitle').innerText = t.subtitle;
            document.getElementById('label-name').innerText = t.nameLabel;
            document.getElementById('name').placeholder = t.namePlaceholder;
            document.getElementById('label-phone').innerText = t.phoneLabel;
            document.getElementById('phone').placeholder = t.phonePlaceholder;
            document.getElementById('label-service').innerText = t.serviceLabel;
            document.getElementById('opt-default').innerText = t.serviceDefault;
            document.getElementById('label-notes').innerText = t.notesLabel;
            document.getElementById('notes').placeholder = t.notesPlaceholder;
            document.getElementById('txt-submit').innerText = t.submitBtn;

            // Modal texts
            document.getElementById('msg-success-title').innerText = t.successTitle;
            document.getElementById('msg-success-desc').innerText = t.successDesc;
            document.getElementById('msg-error-title').innerText = t.errorTitle;
            document.getElementById('msg-error-desc').innerText = t.errorDesc;
            document.getElementById('txt-whatsapp').innerText = t.whatsappBtn;

            // Options text
            t.services.forEach((s, idx) => {
                document.getElementById(`opt-s${idx+1}`).innerText = s;
            });
        }

        async function handleSubmit(e) {
            e.preventDefault();
            const submitBtn = document.getElementById('btn-submit');
            const submitTxt = document.getElementById('txt-submit');
            
            // Disable button during submission
            submitBtn.disabled = true;
            submitBtn.classList.add('opacity-75', 'cursor-not-allowed');
            submitTxt.innerText = currentLang === 'ar' ? 'جاري الإرسال...' : (currentLang === 'fr' ? 'Envoi en cours...' : 'Sending...');

            const formData = new FormData(document.getElementById('requestForm'));
            formData.append('language', currentLang);

            try {
                // Fetch with no-cors / mode handle
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: formData
                });

                // Show success modal
                showModal(true);
                document.getElementById('requestForm').reset();
            } catch (err) {
                console.error("Submission Error:", err);
                // Show error modal with WhatsApp Option
                showModal(false);
            } finally {
                submitBtn.disabled = false;
                submitBtn.classList.remove('opacity-75', 'cursor-not-allowed');
                submitTxt.innerText = translations[currentLang].submitBtn;
            }
        }

        function showModal(isSuccess) {
            const modal = document.getElementById('statusModal');
            const successState = document.getElementById('stateSuccess');
            const errorState = document.getElementById('stateError');

            modal.classList.remove('hidden');

            if (isSuccess) {
                successState.classList.remove('hidden');
                errorState.classList.add('hidden');
            } else {
                errorState.classList.remove('hidden');
                successState.classList.add('hidden');

                // Build custom WhatsApp message with form values
                const nameVal = document.getElementById('name').value;
                const phoneVal = document.getElementById('phone').value;
                const serviceVal = document.getElementById('service').value;
                const notesVal = document.getElementById('notes').value;

                const textMsg = encodeURIComponent(`سلام، حاولنا نبعثو طلب وما فاتش:\n- الاسم: ${nameVal}\n- الهاتف: ${phoneVal}\n- الخدمة: ${serviceVal}\n- تفاصيل: ${notesVal}`);
                document.getElementById('btn-whatsapp').href = `https://wa.me/${WHATSAPP_NUMBER}?text=${textMsg}`;
            }
        }

        function closeModal() {
            document.getElementById('statusModal').classList.add('hidden');
        }
    </script>
</body>
</html>
