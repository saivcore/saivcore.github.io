        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(18, 26, 43, 0.75);
            --border-color: rgba(0, 242, 254, 0.2);
            --primary-cyan: #00f2fe;
            --secondary-blue: #4facfe;
            --accent-green: #00e676;
            --text-main: #f1f5f9;
            --text-sub: #94a3b8;
            --accent-glow: rgba(0, 242, 254, 0.25);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', 'Poppins', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            padding: 30px 15px;
            overflow-x: hidden;
        }

        canvas#particleCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .container {
            width: 100%;
            max-width: 620px;
            z-index: 10;
            position: relative;
        }

        /* Language Switcher Toolbar */
        .lang-toolbar {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
            background: rgba(18, 26, 43, 0.8);
            padding: 8px 12px;
            border-radius: 30px;
            border: 1px solid var(--border-color);
            backdrop-filter: blur(10px);
            width: fit-content;
            margin-left: auto;
            margin-right: auto;
        }

        .lang-btn {
            background: none;
            border: none;
            color: var(--text-sub);
            padding: 6px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.88rem;
            transition: all 0.3s ease;
        }

        .lang-btn.active {
            background: var(--primary-cyan);
            color: #0b0f19;
            box-shadow: 0 0 12px var(--accent-glow);
        }

        /* Main Form Card */
        .form-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 35px 28px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), inset 0 0 20px var(--accent-glow);
        }

        .header-box {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-img {
            width: 85px;
            height: 85px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--primary-cyan);
            box-shadow: 0 0 20px var(--accent-glow);
            margin-bottom: 12px;
        }

        .title {
            font-size: 1.6rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ffffff 30%, var(--primary-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
        }

        .subtitle {
            font-size: 0.9rem;
            color: var(--text-sub);
            line-height: 1.5;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(0, 230, 118, 0.1);
            color: var(--accent-green);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            margin-top: 10px;
            border: 1px solid rgba(0, 230, 118, 0.3);
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background-color: var(--accent-green);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--accent-green);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(1.2); }
            100% { opacity: 1; transform: scale(1); }
        }

        /* Form Controls */
        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            color: var(--primary-cyan);
            font-size: 1.1rem;
            z-index: 2;
        }

        html[dir="rtl"] .input-icon { right: 14px; }
        html[dir="ltr"] .input-icon { left: 14px; }

        .form-control {
            width: 100%;
            padding: 13px 16px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            color: #ffffff;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s ease;
        }

        html[dir="rtl"] .form-control { padding-right: 44px; }
        html[dir="ltr"] .form-control { padding-left: 44px; }

        .form-control:focus {
            border-color: var(--primary-cyan);
            background: rgba(0, 242, 254, 0.05);
            box-shadow: 0 0 15px var(--accent-glow);
        }

        select.form-control {
            appearance: none;
            cursor: pointer;
        }

        select.form-control option {
            background-color: #111827;
            color: #ffffff;
        }

        textarea.form-control {
            resize: vertical;
            min-height: 100px;
            padding-top: 12px;
        }

        html[dir="rtl"] textarea.form-control { padding-right: 44px; }
        html[dir="ltr"] textarea.form-control { padding-left: 44px; }

        /* Submit Button */
        .submit-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, var(--primary-cyan), var(--secondary-blue));
            border: none;
            border-radius: 14px;
            color: #0b0f19;
            font-size: 1.05rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 8px 25px rgba(0, 242, 254, 0.3);
            margin-top: 10px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(0, 242, 254, 0.45);
        }

        /* Footer */
        .footer {
            text-align: center;
            margin-top: 25px;
            font-size: 0.82rem;
            color: var(--text-sub);
            direction: ltr;
        }

        /* Modal Alerts */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(11, 15, 25, 0.85);
            backdrop-filter: blur(8px);
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .modal-card {
            background: #111827;
            border: 1px solid var(--primary-cyan);
            border-radius: 20px;
            padding: 30px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
        }

        .modal-icon {
            font-size: 3rem;
            color: var(--primary-cyan);
            margin-bottom: 15px;
        }

        .modal-title {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 10px;
            color: #fff;
        }

        .modal-desc {
            font-size: 0.9rem;
            color: var(--text-sub);
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .modal-btn {
            background: var(--primary-cyan);
            color: #0b0f19;
            border: none;
            padding: 10px 25px;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
        }

        /* Spinner */
        .spinner {
            border: 3px solid rgba(255,255,255,0.1);
            border-top: 3px solid var(--primary-cyan);
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 0.8s linear infinite;
            display: none;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

                        <select name="service" class="form-control" id="select-service" required>
                            <!-- Options rendered dynamically -->
                        </select>
                    </div>
                </div>

                <!-- Urgency -->
                <div class="form-group">
                    <label class="form-label" id="lbl-urgency">درجة الاستعجال</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-clock input-icon"></i>
                        <select name="urgency" class="form-control" id="select-urgency">

                    <i class="fa-solid fa-paper-plane" id="icon-btn"></i>
                    <div class="spinner" id="btn-spinner"></div>

            document.querySelector('input[name="wilaya"]').placeholder = data.phWilaya;

            document.getElementById('lbl-service').innerText = data.lblService;
            document.getElementById('lbl-urgency').innerText = data.lblUrgency;

            document.getElementById('lbl-details').innerText = data.lblDetails;
            document.querySelector('textarea[name="details"]').placeholder = data.phDetails;

            document.getElementById('txt-btn').innerText = data.btnSubmit;

            // Render Services Dropdown
            const selectService = document.getElementById('select-service');
            selectService.innerHTML = '';
            data.services.forEach(s => {
                const opt = document.createElement('option');
                opt.value = s.val;
                opt.innerText = s.text;
                if (s.disabled) opt.disabled = true, opt.selected = true;
                selectService.appendChild(opt);
            });

            // Render Urgency Dropdown
            const selectUrgency = document.getElementById('select-urgency');
            selectUrgency.innerHTML = '';
            data.urgencies.forEach(u => {
                const opt = document.createElement('option');
                opt.value = u.val;
                opt.innerText = u.text;
                selectUrgency.appendChild(opt);
            });

            // Active Class on Lang Buttons
            document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
        }

        // Initialize Default Language
        switchLang('ar');

        // Form Submission via Fetch API
        const form = document.getElementById('serviceForm');
        form.addEventListener('submit', function(e) {
            e.preventDefault();

            if (!SCRIPT_URL || SCRIPT_URL.includes("ضع_رابط")) {
                alert("يرجى وضع رابط Google Apps Script في الكود أولاً!");
                return;
            }

            // Show Loading State
            document.getElementById('txt-btn').innerText = i18n[currentLang].btnSending;
            document.getElementById('icon-btn').style.display = 'none';
            document.getElementById('btn-spinner').style.display = 'inline-block';

            const formData = new FormData(form);

            fetch(SCRIPT_URL, {
                method: 'POST',
                body: formData
            })
            .then(res => res.json())
            .then(data => {
                resetBtnState();
                if (data.status === 'success') {
                    showModal('success');
                    form.reset();
                } else {
                    showModal('error');
                }
            })
            .catch(err => {
                resetBtnState();
                showModal('error');
            });
        });

        function resetBtnState() {
            document.getElementById('txt-btn').innerText = i18n[currentLang].btnSubmit;
            document.getElementById('icon-btn').style.display = 'inline-block';
            document.getElementById('btn-spinner').style.display = 'none';
        }

        function showModal(type) {
            const modal = document.getElementById('statusModal');
            const data = i18n[currentLang];

            if (type === 'success') {
                document.getElementById('modalIcon').innerHTML = '<i class="fa-solid fa-circle-check" style="color: var(--accent-green)"></i>';
                document.getElementById('modalTitle').innerText = data.modalSuccessTitle;
                document.getElementById('modalDesc').innerText = data.modalSuccessDesc;
            } else {
                document.getElementById('modalIcon').innerHTML = '<i class="fa-solid fa-circle-xmark" style="color: #ff5252"></i>';
                document.getElementById('modalTitle').innerText = data.modalErrorTitle;
                document.getElementById('modalDesc').innerText = data.modalErrorDesc;
            }
            document.getElementById('modalBtn').innerText = data.modalBtnClose;
            modal.classList.add('active');
        }

        function closeModal() {
            document.getElementById('statusModal').classList.remove('active');
        }

        // Particle Canvas Background
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const particles = [];
        for (let i = 0; i < 35; i++) {
            particles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 2 + 0.5,
                speedX: (Math.random() - 0.5) * 0.4,
                speedY: (Math.random() - 0.5) * 0.4,
                alpha: Math.random() * 0.5 + 0.2
            });
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.x += p.speedX;
                p.y += p.speedY;

                if (p.x < 0) p.x = canvas.width;
                if (p.x > canvas.width) p.x = 0;
                if (p.y < 0) p.y = canvas.height;
                if (p.y > canvas.height) p.y = 0;

                ctx.fillStyle = `rgba(0, 242, 254, ${p.alpha})`;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            });
            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
